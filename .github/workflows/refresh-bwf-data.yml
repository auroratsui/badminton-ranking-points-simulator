name: Refresh BWF ranking data

on:
  schedule:
    # Every Tuesday at 15:24 GMT+8 (07:24 UTC).
    - cron: '24 7 * * 2'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-bwf-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm refresh-data
      - name: Commit refreshed data
        shell: bash
        run: |
          if git diff --quiet -- lib/ranking-data.ts lib/ranking-breakdowns.json lib/tournament-calendars.json; then
            echo "BWF data is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/ranking-data.ts lib/ranking-breakdowns.json lib/tournament-calendars.json
          git commit -m "Refresh weekly BWF ranking data"
          git push
