name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ['Refresh BWF ranking data']
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          GITHUB_PAGES: 'true'
      - name: Render the client-only calculator for Pages
        shell: bash
        run: |
          export XDG_CONFIG_HOME="$RUNNER_TEMP/wrangler-config"
          export WRANGLER_LOG_PATH="$RUNNER_TEMP/wrangler.log"
          pnpm exec wrangler dev --config dist/server/wrangler.json --port 8787 --no-bundle --live-reload=false >"$RUNNER_TEMP/ranking-rally.log" 2>&1 &
          server_pid=$!
          repository_name="${GITHUB_REPOSITORY#*/}"
          page_url="http://127.0.0.1:8787/$repository_name/"
          for attempt in {1..30}; do
            if curl --fail --silent "$page_url" --output /dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat "$RUNNER_TEMP/ranking-rally.log"
              exit 1
            fi
            sleep 1
          done
          mkdir -p _site
          if [ ! -d "dist/client/$repository_name" ]; then
            echo "Expected GitHub Pages assets were not generated for $repository_name."
            find dist/client -maxdepth 2 -type d -print
            exit 1
          fi
          cp -R "dist/client/$repository_name/." _site/
          find dist/client -maxdepth 1 -type f -exec cp {} _site/ \;
          curl --fail --silent "$page_url" --output _site/index.html
          cp _site/index.html _site/404.html
          touch _site/.nojekyll
          kill "$server_pid"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
